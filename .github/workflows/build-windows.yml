name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow pytesseract

      - name: Install Tesseract OCR (Via Choco)
        shell: powershell
        run: |
          choco install tesseract --yes
          $p = "C:\Program Files\Tesseract-OCR"
          if (Test-Path "$p\tesseract.exe") { 
              Copy-Item $p "tesseract" -Recurse -Force 
          } else { 
              throw "Tesseract no se instaló correctamente en la ruta esperada" 
          }

      - name: Build
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name "GOL-Playlist-Builder" --add-data "GOL_Playlist_Builder/app/config.json;." --add-data "tesseract;tesseract" --paths "GOL_Playlist_Builder/app" GOL_Playlist_Builder/app/main.py

      - name: Zip
        shell: powershell
        run: Compress-Archive -Path "dist\GOL-Playlist-Builder\*" -DestinationPath "GOL-Playlist-Builder-Windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: GOL-Playlist-Builder-Windows
          path: GOL-Playlist-Builder-Windows.zip
